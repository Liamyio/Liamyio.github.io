baseURL = "https://liamyio.github.io/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "Liam 的嵌入式笔记"
theme = "PaperMod"

[params]
env = "production"
title = "Liam 的嵌入式笔记"
description = "机械在读，奔向机器人嵌入式：底层驱动、电机控制与视觉的学习和项目记录"
author = "Liam（连家维）"
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = true
TocOpen = false
defaultTheme = "auto"
disableThemeToggle = false

[params.homeInfoParams]
Title = "你好，我是 Liam 👋"
Content = """
成都大学机械设计制造及其自动化在读，目标是机器人嵌入式工程师。
这里记录我在底层驱动、电机控制和机器视觉上的学习笔记与项目复盘：智能车备赛、自己画板手焊的蓝牙音响、毕业设计……
写下来是为了想清楚，也是给面试官看的第二份简历。
"""

